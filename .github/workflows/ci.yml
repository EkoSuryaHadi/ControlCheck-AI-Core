name: CI Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and typecheck React SPA
        working-directory: frontend
        run: npm run build

      - name: Lint React SPA
        working-directory: frontend
        run: npm run lint

  test-backend:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: controlcheck
          POSTGRES_PASSWORD: controlcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U controlcheck -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CONTROLCHECK_TEST_POSTGRES_URL: postgresql+psycopg://controlcheck:controlcheck@127.0.0.1:5432/postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: |
          python -m compileall -q api src tests tools alembic

      - name: Validate production configuration
        run: |
          python -m pytest -q tests/test_production_configuration.py tests/test_serverless_entrypoint.py -p no:cacheprovider

      - name: Run full backend suite
        run: |
          python -m pytest -q -p no:cacheprovider

      - name: Check migration drift
        run: |
          python -m pytest -q tests/persistence/test_migrations.py::test_alembic_metadata_has_no_drift -p no:cacheprovider

  docker-build:
    name: Docker Production Image Build Check
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: controlcheck-ai:latest
