services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: controlcheck
      POSTGRES_USER: controlcheck
      POSTGRES_PASSWORD: controlcheck
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlcheck -d controlcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - controlcheck_pgdata:/var/lib/postgresql/data

volumes:
  controlcheck_pgdata:
