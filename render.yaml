services:
  - type: web
    name: controlcheck-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -e ."
    startCommand: "alembic upgrade head && uvicorn controlcheck.asgi:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: CONTROLCHECK_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CONTROLCHECK_JWT_SECRET
        generateValue: true
      - key: CONTROLCHECK_DATABASE_URL
        sync: false
      - key: CONTROLCHECK_CORS_ORIGINS
        value: https://app.controlcheck.ai
      - key: CONTROLCHECK_TRUSTED_HOSTS
        value: controlcheck-api.onrender.com
      - key: CONTROLCHECK_STORAGE_BACKEND
        value: s3
      - key: CONTROLCHECK_S3_BUCKET
        sync: false
      - key: CONTROLCHECK_S3_REGION
        value: ap-southeast-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
