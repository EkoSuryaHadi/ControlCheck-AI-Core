services:
  - type: web
    name: controlcheck-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -e ."
    startCommand: "alembic upgrade head && uvicorn controlcheck.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'
