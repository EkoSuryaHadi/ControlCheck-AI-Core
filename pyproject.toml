[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlcheck-core"
version = "0.2.0"
description = "Deterministic project-control audit engine"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "pydantic>=2.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn>=0.29",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "bcrypt>=4.1",
  "PyJWT>=2.8",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "python-docx>=1.1", "PyYAML>=6.0"]
docs = ["python-docx>=1.1"]

[project.scripts]
controlcheck = "controlcheck.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
