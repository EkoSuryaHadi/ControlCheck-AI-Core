version: "3.9"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: controlcheck-nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - controlcheck_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controlcheck-api
    restart: always
    environment:
      - ENV=production
      - CONTROLCHECK_ENV=production
      - CONTROLCHECK_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-controlcheck}:${POSTGRES_PASSWORD:-controlcheck}@postgres:5432/${POSTGRES_DB:-controlcheck}
      - CONTROLCHECK_JWT_SECRET=${CONTROLCHECK_JWT_SECRET}
      - CONTROLCHECK_CORS_ORIGINS=${CONTROLCHECK_CORS_ORIGINS:-https://app.controlcheck.ai}
      - CONTROLCHECK_CATALOGUE=data/controlcheck_rule_catalogue_v0.2.json
      - CONTROLCHECK_UPLOAD_ROOT=var/uploads
      - CONTROLCHECK_STORAGE_BACKEND=${CONTROLCHECK_STORAGE_BACKEND:-local}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_uploads:/app/var/uploads
      - app_backups:/app/var/backups
    networks:
      - controlcheck_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  postgres:
    image: postgres:16-alpine
    container_name: controlcheck-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-controlcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-controlcheck}
      POSTGRES_DB: ${POSTGRES_DB:-controlcheck}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - controlcheck_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-controlcheck} -d ${POSTGRES_DB:-controlcheck}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

networks:
  controlcheck_net:
    driver: bridge

volumes:
  postgres_data:
  app_uploads:
  app_backups:
